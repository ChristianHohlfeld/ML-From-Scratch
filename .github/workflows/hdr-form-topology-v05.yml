name: HDR Form Topology v0.5
on:
  pull_request:
    paths:
      - 'research/hdr-motor-ai/form-topology-v05/**'
      - '.github/workflows/hdr-form-topology-v05.yml'
  push:
    paths:
      - 'research/hdr-motor-ai/form-topology-v05/**'
      - '.github/workflows/hdr-form-topology-v05.yml'
jobs:
  geometry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/hdr-motor-ai/form-topology-v05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/hdr-motor-ai/form-topology-v05/requirements.txt
      - name: Install numerical dependencies
        run: pip install numpy scipy trimesh scikit-learn pytest
      - name: Test topology invariants and wave coupling
        run: OPENBLAS_NUM_THREADS=1 pytest -q tests/test_form.py
      - name: Reproduce primary benchmark
        run: OPENBLAS_NUM_THREADS=1 PYTHONPATH=src python -m benchmark --samples 36 --output /tmp/hdr-v05-benchmark.json
      - name: Verify benchmark against locked reference
        run: |
          python - <<'PY'
          import json
          reference = json.load(open('results/benchmark.json'))
          actual = json.load(open('/tmp/hdr-v05-benchmark.json'))
          assert actual['metrics'] == reference['metrics'], (actual['metrics'], reference['metrics'])
          PY
      - name: Build standalone 3D lab
        run: |
          python src/build.py
          python - <<'PY'
          from pathlib import Path
          html = Path('dist/index.html').read_text()
          assert '<script src=' not in html
          assert 'HDR_MESHES' in html and 'HDR_BENCHMARK' in html
          PY
