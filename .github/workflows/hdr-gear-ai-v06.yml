name: HDR Gear AI v0.6 tests
on:
  push:
    paths:
      - 'research/hdr-motor-ai/v06/**'
      - '.github/workflows/hdr-gear-ai-v06.yml'
  pull_request:
    paths:
      - 'research/hdr-motor-ai/v06/**'
      - '.github/workflows/hdr-gear-ai-v06.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/hdr-motor-ai/v06
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/engine.test.cjs
      - run: python scripts/build_web.py
      - run: git diff --exit-code -- dist/gear_lab.html
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/hdr-motor-ai/v06
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - run: python tests/browser_smoke.py
