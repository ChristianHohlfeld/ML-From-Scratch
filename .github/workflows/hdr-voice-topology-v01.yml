name: HDR Voice Topology v0.1
on:
  push:
    paths:
      - 'research/hdr-motor-ai/voice-topology-v01/**'
      - '.github/workflows/hdr-voice-topology-v01.yml'
  pull_request:
    paths:
      - 'research/hdr-motor-ai/voice-topology-v01/**'
      - '.github/workflows/hdr-voice-topology-v01.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/hdr-motor-ai/voice-topology-v01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/benchmark.py
      - run: python scripts/build.py
      - run: node --test tests/test_engine.cjs
      - run: python -c "from pathlib import Path; assert Path('dist/index.html').stat().st_size > 15000"
