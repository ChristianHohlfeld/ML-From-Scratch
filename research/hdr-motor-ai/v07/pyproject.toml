[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hdr-gear-ai-physical"
version = "0.7.0"
description = "Two-input serial linkage with a direct optical output and measurement toolchain"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
vision = ["opencv-contrib-python-headless>=4.8", "pyserial>=3.5"]
[tool.setuptools.packages.find]
include = ["gear_ai*"]
