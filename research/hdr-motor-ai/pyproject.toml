[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hdr-motor-ai"
version = "0.3.0"
description = "Trainable physically inspired analog relational gear network with passive V0"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["hdr_motor_ai*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
