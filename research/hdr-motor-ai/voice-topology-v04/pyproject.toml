[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "hdr-waveform"
version = "0.4.0"
description = "Full 3-D membrane surface / 3-D FDTD bidirectional acoustic interaction, experimental research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.59"]
[project.optional-dependencies]
test = ["pytest>=7"]
[tool.setuptools.packages.find]
where = ["."]
include = ["waveform*"]
